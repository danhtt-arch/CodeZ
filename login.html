<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - CodeZ Academy</title>
  <meta name="description" content="Đăng nhập tài khoản CodeZ Academy để quản lý khóa học của bạn." />
  <link rel="icon" type="image/png" href="images/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body data-page="login" class="bg-white font-body text-ink-soft antialiased">

  <div id="site-header"></div>

  <main class="relative overflow-hidden bg-surface">
    <div class="pointer-events-none absolute -right-32 -top-32 h-96 w-96 rounded-full bg-blue-200/40 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-40 -left-24 h-96 w-96 rounded-full bg-sky-200/40 blur-3xl"></div>

    <div class="relative mx-auto flex min-h-[70vh] max-w-md items-center px-4 py-16">
      <div class="w-full rounded-2xl bg-white p-6 shadow-xl ring-1 ring-slate-200 sm:p-8">
        <h1 class="font-heading text-2xl font-extrabold text-ink sm:text-3xl">Đăng nhập</h1>
        <p class="mt-2 text-slate-600">Chào mừng bạn quay lại CodeZ Academy.</p>

        <form id="login-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="email" class="mb-1.5 block text-sm font-semibold text-ink">Email</label>
            <input id="email" type="email" class="field" placeholder="ban@example.com" autocomplete="email" required />
          </div>
          <div>
            <label for="password" class="mb-1.5 block text-sm font-semibold text-ink">Mật khẩu</label>
            <input id="password" type="password" class="field" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button id="submit-btn" type="submit" class="inline-flex w-full items-center justify-center rounded-lg bg-primary px-6 py-3.5 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-primary-light disabled:cursor-not-allowed disabled:opacity-60">
            <span id="submit-label">Đăng nhập</span>
          </button>
        </form>

        <div id="result" class="mt-5 hidden" role="status" aria-live="polite"></div>

        <p class="mt-6 text-center text-sm text-slate-600">
          Chưa có tài khoản?
          <a id="register-link" href="register.html" class="font-semibold text-primary hover:underline">Đăng ký ngay</a>
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/app.js"></script>
  <script>
    const { db, showMessage, setBusy, authError } = CodeZ;
    const $ = (id) => document.getElementById(id);

    // Trang quay lại sau khi đăng nhập (?next=detail.html). Chỉ nhận tên file .html nội bộ.
    function safeNext() {
      const next = new URLSearchParams(window.location.search).get('next') || '';
      return /^[\w-]+\.html(\?[\w=&%-]*)?(#[\w-]*)?$/.test(next) ? next : 'index.html';
    }

    // Giữ tham số next khi chuyển sang trang đăng ký
    const nextParam = new URLSearchParams(window.location.search).get('next');
    if (nextParam) $('register-link').href = 'register.html?next=' + encodeURIComponent(safeNext());

    // Đã đăng nhập rồi thì không cần ở trang này
    CodeZ.onUser((user) => { if (user) window.location.replace(safeNext()); });

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = $('result');
      const email = $('email').value.trim();
      const password = $('password').value;

      if (!email || !password) {
        return showMessage(result, 'error', 'Vui lòng nhập email và mật khẩu.');
      }

      setBusy($('submit-btn'), $('submit-label'), true, 'Đang đăng nhập…', 'Đăng nhập');
      try {
        // Đăng nhập bằng email + mật khẩu (Supabase Auth)
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;

        showMessage(result, 'success', 'Đăng nhập thành công. Đang chuyển trang…');
        window.location.href = safeNext();
      } catch (err) {
        console.error('[signIn]', err);
        showMessage(result, 'error', CodeZ.esc(authError(err)));
        setBusy($('submit-btn'), $('submit-label'), false, 'Đang đăng nhập…', 'Đăng nhập');
      }
    });
  </script>
</body>
</html>
