<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản - CodeZ Academy</title>
  <meta name="description" content="Tạo tài khoản CodeZ Academy để đăng ký và quản lý khóa học." />
  <link rel="icon" type="image/png" href="images/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body data-page="register" class="bg-white font-body text-ink-soft antialiased">

  <div id="site-header"></div>

  <main class="relative overflow-hidden bg-surface">
    <div class="pointer-events-none absolute -right-32 -top-32 h-96 w-96 rounded-full bg-blue-200/40 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-40 -left-24 h-96 w-96 rounded-full bg-sky-200/40 blur-3xl"></div>

    <div class="relative mx-auto flex min-h-[70vh] max-w-md items-center px-4 py-16">
      <div class="w-full rounded-2xl bg-white p-6 shadow-xl ring-1 ring-slate-200 sm:p-8">
        <h1 class="font-heading text-2xl font-extrabold text-ink sm:text-3xl">Tạo tài khoản</h1>
        <p class="mt-2 text-slate-600">Bắt đầu hành trình lập trình cùng CodeZ Academy.</p>

        <form id="register-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="full_name" class="mb-1.5 block text-sm font-semibold text-ink">Họ và tên</label>
            <input id="full_name" type="text" class="field" placeholder="Nguyễn Văn A" autocomplete="name" maxlength="100" required />
          </div>
          <div>
            <label for="email" class="mb-1.5 block text-sm font-semibold text-ink">Email</label>
            <input id="email" type="email" class="field" placeholder="ban@example.com" autocomplete="email" required />
          </div>
          <div>
            <label for="password" class="mb-1.5 block text-sm font-semibold text-ink">Mật khẩu</label>
            <input id="password" type="password" class="field" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" required />
          </div>
          <div>
            <label for="password2" class="mb-1.5 block text-sm font-semibold text-ink">Nhập lại mật khẩu</label>
            <input id="password2" type="password" class="field" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required />
          </div>
          <button id="submit-btn" type="submit" class="inline-flex w-full items-center justify-center rounded-lg bg-primary px-6 py-3.5 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-primary-light disabled:cursor-not-allowed disabled:opacity-60">
            <span id="submit-label">Đăng ký</span>
          </button>
        </form>

        <div id="result" class="mt-5 hidden" role="status" aria-live="polite"></div>

        <p class="mt-6 text-center text-sm text-slate-600">
          Đã có tài khoản?
          <a id="login-link" href="login.html" class="font-semibold text-primary hover:underline">Đăng nhập</a>
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/app.js"></script>
  <script>
    const { db, esc, showMessage, setBusy, authError } = CodeZ;
    const $ = (id) => document.getElementById(id);

    // Trang quay lại sau khi đăng ký (?next=detail.html). Chỉ nhận tên file .html nội bộ.
    function safeNext() {
      const next = new URLSearchParams(window.location.search).get('next') || '';
      return /^[\w-]+\.html(\?[\w=&%-]*)?(#[\w-]*)?$/.test(next) ? next : 'index.html';
    }

    const nextParam = new URLSearchParams(window.location.search).get('next');
    if (nextParam) $('login-link').href = 'login.html?next=' + encodeURIComponent(safeNext());

    // Đã đăng nhập rồi thì không cần ở trang này
    CodeZ.onUser((user) => { if (user) window.location.replace(safeNext()); });

    $('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = $('result');
      const full_name = $('full_name').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;

      if (full_name.length < 2) return showMessage(result, 'error', 'Vui lòng nhập họ tên (ít nhất 2 ký tự).');
      if (!email) return showMessage(result, 'error', 'Vui lòng nhập email.');
      if (password.length < 6) return showMessage(result, 'error', 'Mật khẩu phải có ít nhất 6 ký tự.');
      if (password !== $('password2').value) return showMessage(result, 'error', 'Hai mật khẩu không khớp.');

      setBusy($('submit-btn'), $('submit-label'), true, 'Đang tạo tài khoản…', 'Đăng ký');
      try {
        // Tạo tài khoản (Supabase Auth). Họ tên lưu trong user_metadata.full_name
        const options = { data: { full_name } };
        if (/^https?:$/.test(window.location.protocol)) {
          // Link trong email xác nhận sẽ đưa người dùng về trang đăng nhập
          options.emailRedirectTo = new URL('login.html', window.location.href).href;
        }
        const { data, error } = await db.auth.signUp({ email, password, options });
        if (error) throw error;

        if (data.session) {
          // Dự án tắt xác nhận email: đã đăng nhập luôn
          showMessage(result, 'success', 'Tạo tài khoản thành công. Đang chuyển trang…');
          window.location.href = safeNext();
        } else if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
          // Email đã tồn tại (Supabase không báo lỗi để tránh lộ thông tin tài khoản)
          showMessage(result, 'info', 'Email này đã được đăng ký. Hãy <a class="font-semibold underline" href="login.html">đăng nhập</a>.');
          setBusy($('submit-btn'), $('submit-label'), false, '', 'Đăng ký');
        } else {
          showMessage(result, 'success', `Tạo tài khoản thành công! Chúng tôi đã gửi email xác nhận tới <strong>${esc(email)}</strong>. Vui lòng bấm vào link trong email, sau đó đăng nhập.`);
          $('register-form').reset();
          setBusy($('submit-btn'), $('submit-label'), false, '', 'Đăng ký');
        }
      } catch (err) {
        console.error('[signUp]', err);
        showMessage(result, 'error', esc(authError(err)));
        setBusy($('submit-btn'), $('submit-label'), false, '', 'Đăng ký');
      }
    });
  </script>
</body>
</html>
